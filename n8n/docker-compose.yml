services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_SHARED_SECRET: ${N8N_SHARED_SECRET}
      SUPABASE_INTEGRATION_BASE_URL: ${SUPABASE_INTEGRATION_BASE_URL:-https://yncfmpbapocdxcmqdeke.supabase.co/functions/v1/integration-v1}
      SUPABASE_INTEGRATION_URL: ${SUPABASE_INTEGRATION_URL}
      CUSTOM_WA_API_BASE_URL: ${CUSTOM_WA_API_BASE_URL:-http://host.docker.internal:3001}
      CUSTOM_WA_API_SEND_PATH: ${CUSTOM_WA_API_SEND_PATH:-/v1/messages/send}
      CUSTOM_WA_API_AUTH_HEADER: ${CUSTOM_WA_API_AUTH_HEADER:-authorization}
      CUSTOM_WA_API_AUTH_VALUE: ${CUSTOM_WA_API_AUTH_VALUE:-}
      CUSTOM_WA_WEBHOOK_SECRET: ${CUSTOM_WA_WEBHOOK_SECRET:-}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Argentina/Buenos_Aires}
      TZ: ${GENERIC_TIMEZONE:-America/Argentina/Buenos_Aires}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro

volumes:
  n8n_data:
